<script>
  /* TEMA ANTES DA PRIMEIRA PINTURA.

     O tema escolhido mora no localStorage, e lê-lo depois que o app.js carrega
     significaria pintar a tela clara e trocar para escura no quadro seguinte —
     o "flash branco" que todo app de tema duplo tem quando essa decisão desce
     para o fim da fila. Este bloco é minúsculo e síncrono de propósito: ele
     precisa rodar antes de o body existir. */
  try {
    var _t = localStorage.getItem('cesta.tema');
    if (_t === 'dark' || _t === 'light') document.documentElement.dataset.tema = _t;
  } catch (e) {}
</script>
<script>
  /* RECUPERAÇÃO, FORA DO APP.

     Este bloco não depende de módulo nenhum, e é de propósito: quando o app
     quebra — um erro de sintaxe, um arquivo que não carregou — o boot não roda,
     e um mecanismo de atualização que viva lá dentro morre junto com o que ele
     deveria consertar. Foi o que aconteceu: uma correção publicada não chegava
     a quem estava com a versão quebrada, e a única saída era apagar os dados do
     domínio inteiro — levando junto os do app de finanças, que mora na mesma
     origem.

     Aqui ele pergunta por uma versão nova a cada abertura, e recarrega uma vez
     quando ela assume. A guarda contra laço não é zelo: sem ela, um service
     worker que reassuma a cada carga põe a página num ciclo infinito. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update().catch(function () {});
    }).catch(function () {});

    var _recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (_recarregou) return;
      _recarregou = true;
      location.reload();
    });
  }

  /* A TELA BRANCA PASSA A SE EXPLICAR.

     Um erro de sintaxe em qualquer script deixava a página em branco, sem ícone
     e sem texto — nada dizia à pessoa o que houve nem o que fazer. Agora o erro
     é capturado e vira uma tela com o motivo e um botão que limpa APENAS o
     cache deste app: sem tocar nos dados, e sem tocar no app vizinho. */
  function _mostrarFalha(ev) {
    if (document.body && document.body.dataset.montado === '1') return;
    var alvo = document.getElementById('tela') || document.body;
    if (!alvo || alvo.dataset.erroMostrado === '1') return;
    alvo.dataset.erroMostrado = '1';
    alvo.innerHTML =
      '<div style="max-width:420px;margin:40px auto;padding:20px;text-align:center;' +
      'font-family:system-ui,sans-serif;color:#EDEFF4">' +
      '<h1 style="font-size:19px;margin:0 0 8px">O app não abriu</h1>' +
      '<p style="font-size:13px;color:#A2A9B8;line-height:1.5;margin:0 0 16px">' +
      'Alguma coisa falhou ao carregar. Seus dados estão salvos — isto não os apaga.</p>' +
      '<p style="font-size:11px;color:#757D8E;word-break:break-word;margin:0 0 16px">' +
      String(ev.message || ev.error || '').slice(0, 200) + '</p>' +
      '<button id="_limpar" style="width:100%;min-height:46px;border:0;border-radius:999px;' +
      'background:#8FA8FF;color:#070A12;font-size:14px;font-weight:600;cursor:pointer">' +
      'Baixar a versão nova e tentar de novo</button></div>';
    var b = document.getElementById('_limpar');
    if (b) b.onclick = function () {
      /* Apaga SÓ os caches deste app e o service worker dele. Os dados no
         localStorage ficam, e o app de finanças não é tocado. */
      var fim = function () { location.reload(true); };
      if (!window.caches) return fim();
      caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) { return k.indexOf('cesta-') === 0; })
                             .map(function (k) { return caches.delete(k); }));
      }).then(function () {
        if (!navigator.serviceWorker) return;
        return navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        });
      }).then(fim).catch(fim);
    };
  }

  /* OS DOIS EVENTOS, e não só o primeiro.

     O boot é assíncrono: `Auth.iniciar` é uma async function, e um erro dentro
     dela não vira um `error` na janela — vira uma PROMISE REJEITADA. Foi por
     isso que a tela de recuperação não apareceu justamente na falha que mais
     precisava dela: o app morria calado, e a pessoa via só o branco. */
  window.addEventListener('error', _mostrarFalha);
  window.addEventListener('unhandledrejection', function (ev) {
    _mostrarFalha({ message: (ev.reason && ev.reason.message) || String(ev.reason || '') });
  });
</script>
</head>
<body>

<!-- A TELA DE BLOQUEIO vive FORA do #app e cobre tudo: enquanto os dados estão
     cifrados, nada do app pode ser desenhado por baixo dela. -->
<div id="lock" class="lock" hidden></div>

<div id="app">

  <!-- SIDEBAR (desktop). No celular ela some e a navegação vira a barra de
       baixo: é o mesmo app com duas ergonomias, não dois layouts. -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="icons/icon.svg" alt="">
      <div><b>CESTA</b><small id="side-familia">Suas compras</small></div>
    </div>

    <nav class="sidebar-menu">
      <p class="sidebar-section">Dia a dia</p>
      <button class="side-item" data-aba="hoje"><span class="tab-ico" data-ico="casa"></span>Hoje</button>
      <button class="side-item" data-aba="planejar"><span class="tab-ico" data-ico="lista"></span>Planejar</button>
      <button class="side-item" data-aba="mercado"><span class="tab-ico" data-ico="carrinho"></span>Modo Mercado</button>
      <p class="sidebar-section">A casa</p>
      <button class="side-item" data-aba="despensa"><span class="tab-ico" data-ico="despensa"></span>Despensa</button>
      <button class="side-item" data-aba="analise"><span class="tab-ico" data-ico="historico"></span>Análise</button>
    </nav>

    <div class="sidebar-footer">
      <button class="side-item" id="side-ajuda"><span class="tab-ico" data-ico="ajuda"></span>Ajuda</button>
      <button class="side-item" id="side-ajustes"><span class="tab-ico" data-ico="ajustes"></span>Ajustes</button>
    </div>
  </aside>

  <div class="wrapper">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="topbar-logo">
            <img src="icons/icon.svg" alt="">
            <span>CESTA</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-sync" title="Sincronizar" aria-label="Sincronizar agora" hidden>
            <span data-ico="sincronizar"></span>
            <i class="sync-dot" id="sync-dot" aria-hidden="true"></i>
          </button>
          <button class="icon-btn" id="btn-ajuda" title="Ajuda" aria-label="Ajuda">
            <span data-ico="ajuda"></span>
          </button>
          <button class="icon-btn" id="btn-tema" title="Alternar tema" aria-label="Alternar tema">
            <span data-ico="tema"></span>
          </button>
          <button class="icon-btn" id="btn-ajustes" title="Ajustes" aria-label="Ajustes">
            <span data-ico="ajustes"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="content">
      <p id="sync-status" class="sync-status" role="status" hidden></p>
      <main id="tela" class="view">
        <!-- As telas são montadas por js/app.js. Nada de conteúdo estático:
             HTML de exemplo esquecido no shell vira dado fantasma na primeira
             abertura, e ninguém entende de onde ele veio. -->
      </main>
    </div>
  </div>

  <!-- BARRA INFERIOR (celular). Fica na zona do polegar, a única parte da tela
       alcançável com uma mão enquanto a outra segura o carrinho. -->
  <nav class="tabbar" aria-label="Navegação principal">
    <button class="tab" data-aba="hoje" aria-current="page">
      <span class="tab-ico" data-ico="casa"></span>Hoje
    </button>
    <button class="tab" data-aba="planejar">
      <span class="tab-ico" data-ico="lista"></span>Planejar
    </button>
    <button class="tab" data-aba="mercado">
      <span class="tab-ico" data-ico="carrinho"></span>Mercado
    </button>
    <button class="tab" data-aba="despensa">
      <span class="tab-ico" data-ico="despensa"></span>Despensa
    </button>
    <button class="tab" data-aba="analise">
      <span class="tab-ico" data-ico="historico"></span>Análise
    </button>
  </nav>

</div>
