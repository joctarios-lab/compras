<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CESTA — Compras de Mercado</title>
<meta name="description" content="Esse preço tá bom? A resposta no corredor, comparando com o que você já pagou — offline.">
<!-- A cor da barra do sistema acompanha o tema. Sem os dois, um app instalado em
     tema claro abre com a faixa preta do escuro. -->
<meta name="theme-color" content="#070A12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Figtree nos títulos e na marca; Inter nos valores, onde dígito de largura
     fixa importa mais que personalidade. As mesmas do DOMI. -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- O sistema visual do DOMI, herdado sem alteração, e a camada do CESTA por
     cima. A ordem importa: a camada só acrescenta o que é de compras. -->
<link rel="stylesheet" href="css/domi.css?v=5">
<link rel="stylesheet" href="css/cesta.css?v=5">
<script>
  /* TEMA ANTES DA PRIMEIRA PINTURA.

     O tema escolhido mora no localStorage, e lê-lo depois que o app.js carrega
     significaria pintar a tela clara e trocar para escura no quadro seguinte —
     o "flash branco" que todo app de tema duplo tem quando essa decisão desce
     para o fim da fila. Este bloco é minúsculo e síncrono de propósito: ele
     precisa rodar antes de o body existir. */
  try {
    var _t = localStorage.getItem('cesta.tema');
    if (_t === 'dark' || _t === 'light') document.documentElement.dataset.tema = _t;
  } catch (e) {}
</script>
</head>
<body>

<!-- A TELA DE BLOQUEIO vive FORA do #app e cobre tudo: enquanto os dados estão
     cifrados, nada do app pode ser desenhado por baixo dela. -->
<div id="lock" class="lock" hidden></div>

<div id="app">

  <!-- SIDEBAR (desktop). No celular ela some e a navegação vira a barra de
       baixo: é o mesmo app com duas ergonomias, não dois layouts. -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="icons/icon.svg" alt="">
      <div><b>CESTA</b><small id="side-familia">Suas compras</small></div>
    </div>

    <nav class="sidebar-menu">
      <p class="sidebar-section">Dia a dia</p>
      <button class="side-item" data-aba="hoje"><span class="tab-ico" data-ico="casa"></span>Hoje</button>
      <button class="side-item" data-aba="planejar"><span class="tab-ico" data-ico="lista"></span>Planejar</button>
      <button class="side-item" data-aba="mercado"><span class="tab-ico" data-ico="carrinho"></span>Modo Mercado</button>
      <p class="sidebar-section">A casa</p>
      <button class="side-item" data-aba="despensa"><span class="tab-ico" data-ico="despensa"></span>Despensa</button>
      <button class="side-item" data-aba="analise"><span class="tab-ico" data-ico="historico"></span>Análise</button>
    </nav>

    <div class="sidebar-footer">
      <button class="side-item" id="side-ajuda"><span class="tab-ico" data-ico="ajuda"></span>Ajuda</button>
      <button class="side-item" id="side-ajustes"><span class="tab-ico" data-ico="ajustes"></span>Ajustes</button>
    </div>
  </aside>

  <div class="wrapper">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="topbar-logo">
            <img src="icons/icon.svg" alt="">
            <span>CESTA</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-ajuda" title="Ajuda" aria-label="Ajuda">
            <span data-ico="ajuda"></span>
          </button>
          <button class="icon-btn" id="btn-tema" title="Alternar tema" aria-label="Alternar tema">
            <span data-ico="tema"></span>
          </button>
          <button class="icon-btn" id="btn-ajustes" title="Ajustes" aria-label="Ajustes">
            <span data-ico="ajustes"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="content">
      <main id="tela" class="view">
        <!-- As telas são montadas por js/app.js. Nada de conteúdo estático:
             HTML de exemplo esquecido no shell vira dado fantasma na primeira
             abertura, e ninguém entende de onde ele veio. -->
      </main>
    </div>
  </div>

  <!-- BARRA INFERIOR (celular). Fica na zona do polegar, a única parte da tela
       alcançável com uma mão enquanto a outra segura o carrinho. -->
  <nav class="tabbar" aria-label="Navegação principal">
    <button class="tab" data-aba="hoje" aria-current="page">
      <span class="tab-ico" data-ico="casa"></span>Hoje
    </button>
    <button class="tab" data-aba="planejar">
      <span class="tab-ico" data-ico="lista"></span>Planejar
    </button>
    <button class="tab" data-aba="mercado">
      <span class="tab-ico" data-ico="carrinho"></span>Mercado
    </button>
    <button class="tab" data-aba="despensa">
      <span class="tab-ico" data-ico="despensa"></span>Despensa
    </button>
    <button class="tab" data-aba="analise">
      <span class="tab-ico" data-ico="historico"></span>Análise
    </button>
  </nav>

</div>

<script src="js/config.js?v=5"></script>
<script src="js/icons.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/catalogo.js?v=5"></script>
<script src="js/db.js?v=5"></script>
<script src="js/precos.js?v=5"></script>
<script src="js/despensa.js?v=5"></script>
<script src="js/decisoes.js?v=5"></script>
<script src="js/cozinha.js?v=5"></script>
<script src="js/nfce.js?v=5"></script>
<script src="js/importar.js?v=5"></script>
<script src="js/fotos.js?v=5"></script>
<script src="js/leitura.js?v=5"></script>
<script src="js/auth.js?v=5"></script>
<script src="js/bloqueio.js?v=5"></script>
<script src="js/sync.js?v=5"></script>
<script src="js/onboarding.js?v=5"></script>
<script src="js/views/historico.js?v=5"></script>
<script src="js/views/produtos.js?v=5"></script>
<script src="js/planejar.js?v=5"></script>
<script src="js/views/hoje.js?v=5"></script>
<script src="js/views/planejar.js?v=5"></script>
<script src="js/views/despensa.js?v=5"></script>
<script src="js/views/analise.js?v=5"></script>
<script src="js/views/dialogos.js?v=5"></script>
<script src="js/views/lista.js?v=5"></script>
<script src="js/views/mercado.js?v=5"></script>
<script src="js/views/ferramentas.js?v=5"></script>
<script src="js/views/importar.js?v=5"></script>
<script src="js/views/ajustes.js?v=5"></script>
<script src="js/views/sync.js?v=5"></script>
<script src="js/views/familia.js?v=5"></script>
<script src="js/views/camera.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
